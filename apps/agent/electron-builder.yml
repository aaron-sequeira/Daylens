appId: ai.worksight.agent
productName: WorkSight Agent
# pnpm hoists `electron` to the root node_modules, so electron-builder can't auto-detect
# the version from apps/agent. Pin it to the installed version (keep in sync with the
# `electron` devDependency / lockfile if you upgrade).
electronVersion: 33.4.11
directories:
  output: release
  buildResources: resources
# Native deps live in the hoisted root node_modules (pnpm node-linker=hoisted); the
# `prebuild` step puts them on Electron's ABI, and `build` passes --config.npmRebuild=false
# so electron-builder bundles the prebuilt binaries instead of recompiling.
files:
  - out/**/*
  - package.json
# asar is DISABLED on purpose. active-win has a native .node, so electron-builder unpacks
# it to app.asar.unpacked — but its runtime JS dependency (@mapbox/node-pre-gyp, used to
# locate that .node) stays inside app.asar and is unreachable from the unpacked copy
# (require walks the unpacked tree, never crossing back into the archive) -> MODULE_NOT_FOUND
# at call time -> foreground lookups silently return null -> nothing is tracked. Shipping
# unarchived keeps the whole dependency tree on disk with normal resolution.
asar: false
# Runtime tray icon. buildResources (resources/) is build-time only and is NOT copied
# into the app, so ship tray.png explicitly to process.resourcesPath; index.ts loads it
# from there when packaged. (icon.png is only the installer/exe icon, set via win.icon.)
extraResources:
  - from: resources/tray.png
    to: tray.png
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Utility
